name: Probe HLS
on: push
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-hls' && !contains(github.event.head_commit.message, 'probe results')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/probe_hls.py > probe_out.txt 2>&1 || true
          git rm -q --cached probe_out.txt 2>/dev/null || true
