name: Probe RDS
on:
  push:
    branches: [probe-rds]
    paths: ["scripts/probe_rds.py", ".github/workflows/probe-rds.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/probe_rds.py > probe-out.txt 2>&1 || true
          for u in https://somafm.com/songs/u80s.json https://api.somafm.com/channels.json; do echo "== $u" >> probe-out.txt; curl -sS -D - -H "Origin: https://wolftronixsd.github.io" --max-time 8 "$u" | head -c 700 >> probe-out.txt; echo >> probe-out.txt; done
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out.txt; git commit -m "probe results [skip ci]"; git push
