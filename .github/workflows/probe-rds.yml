name: Probe RDS
on:
  push:
    branches: [probe-rds]
    paths: ["scripts/probe_rds.py", ".github/workflows/probe-rds.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 1
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          for u in https://ice2.somafm.com/u80s-64-aac https://ice2.somafm.com/u80s-128-mp3 https://ice1.somafm.com/u80s-128-aac https://ice2.somafm.com/u80s-128-aac; do
            echo "=== $u" >> probe-out.txt
            curl -sS -L --max-time 6 -A "$UA" -D - -o s.bin "$u" | grep -iE "^HTTP|^location|^content-type|^icy-br|^access-control" >> probe-out.txt 2>&1
            echo "bytes $(wc -c < s.bin)" >> probe-out.txt
            ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,bit_rate -of compact s.bin >> probe-out.txt 2>&1
            ffmpeg -v error -i s.bin -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume" >> probe-out.txt
            ffmpeg -v error -i s.bin -f null - >> probe-out.txt 2>&1; echo "decode-exit $?" >> probe-out.txt
          done
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out.txt; git commit -m "relay results [skip ci]"; git push
