name: Probe RDS
on:
  push:
    branches: [probe-rds]
    paths: ["scripts/probe_rds.py", ".github/workflows/probe-rds.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 1
          set +e
          sleep 60
          rm -f probe-out.txt
          curl -sS -D - https://darling-kheer-93b7f4.netlify.app/ -o page.html | grep -i "content-security\|^HTTP" >> probe-out.txt
          grep -o -i "<script[^>]*>" page.html >> probe-out.txt
          grep -c -i "netlify" page.html >> probe-out.txt
          curl -sS -o /dev/null -w "nowplaying %{http_code}\n" "https://darling-kheer-93b7f4.netlify.app/api/nowplaying?url=https%3A%2F%2Fstream.antenne.de%2Fantenne%2Fstream%2Fmp3" >> probe-out.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out.txt; git commit -m "relay results [skip ci]"; git push
