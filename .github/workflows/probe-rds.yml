name: Probe RDS
on:
  push:
    branches: [probe-rds]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_rds.py
      - run: for u in https://somafm.com/songs/u80s.json https://api.somafm.com/channels.json; do echo "== $u"; curl -sS -D - -H "Origin: https://wolftronixsd.github.io" --max-time 8 "$u" | head -c 700; echo; done
