name: Check streams
# Plays a few seconds of every station from GitHub's servers and reports which ones answer.
on:
  push:
    paths: ["index.html", "scripts/check_streams.py", ".github/workflows/check-streams.yml"]
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:
    inputs:
      extra:
        description: "Extra stream URLs to test, separated by spaces"
        required: false
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_streams.py $EXTRA
        env:
          EXTRA: ${{ github.event.inputs.extra }}
  visualizer:
    # Plays every music station in a real (headless) Chrome and checks the visualizer gets live sound
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/viz_check.mjs
